name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS (universal arm64 + x86_64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-macos-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j4

      - name: Check universal binary
        run: lipo -info "build/CroftDAW_artefacts/Release/Croft DAW.app/Contents/MacOS/Croft DAW"

      - name: Package
        run: |
          cd build/CroftDAW_artefacts/Release
          ditto -c -k --keepParent "Croft DAW.app" Croft-DAW-macOS-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Croft-DAW-macOS-universal
          path: build/CroftDAW_artefacts/Release/Croft-DAW-macOS-universal.zip

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake pkg-config \
            libasound2-dev libjack-jackd2-dev jackd2 \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev \
            libxi-dev libxrender-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j4

      - name: Test - demo session + stem export
        run: |
          xvfb-run -a "build/CroftDAW_artefacts/Release/Croft DAW" --demo --export-stems "$RUNNER_TEMP/stems" | tee export.log
          test "$(grep -c Wrote export.log)" -ge 4

      - name: Test - recording, take lanes and loop takes (virtual JACK device)
        run: |
          jackd -r -d dummy -r 44100 -p 256 -C 2 -P 2 &
          sleep 3
          xvfb-run -a "build/CroftDAW_artefacts/Release/Croft DAW" --test-record | tee record.log
          grep -q "\[record-test\] PASS" record.log

      - name: Package
        run: |
          mkdir -p pkg/croft-daw
          cp "build/CroftDAW_artefacts/Release/Croft DAW" pkg/croft-daw/
          cp assets/icon.png packaging/linux/croft-daw.desktop packaging/linux/install.sh pkg/croft-daw/
          tar -C pkg -czf Croft-DAW-linux-x86_64.tar.gz croft-daw

      - uses: actions/upload-artifact@v4
        with:
          name: Croft-DAW-linux-x86_64
          path: Croft-DAW-linux-x86_64.tar.gz
